<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CollabDoc</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --ink:    #1a1814;
    --paper:  #f7f4ef;
    --cream:  #ede9e1;
    --rule:   #d4cfc5;
    --accent: #c0392b;
    --green:  #27ae60;
    --blue:   #2980b9;
    --shadow: rgba(26,24,20,.10);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--cream);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Top bar ── */
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 28px;
    height: 56px;
    background: var(--ink);
    color: var(--paper);
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 1.45rem;
    letter-spacing: .02em;
    flex: 1;
  }
  header h1 span { color: var(--accent); font-style: italic; }

  #status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #555; flex-shrink: 0;
    transition: background .3s;
  }
  #status-dot.online  { background: var(--green); }
  #status-dot.offline { background: var(--accent); }

  #status-text { font-size: .72rem; letter-spacing: .06em; opacity: .7; }

  /* ── Layout ── */
  main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  aside {
    width: 220px;
    background: var(--paper);
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-section {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--rule);
  }
  .sidebar-label {
    font-size: .62rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .45;
    margin-bottom: 10px;
  }

  /* Join form */
  #join-form input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--rule);
    background: var(--cream);
    font-family: inherit;
    font-size: .78rem;
    color: var(--ink);
    margin-bottom: 8px;
    outline: none;
    border-radius: 3px;
  }
  #join-form input:focus { border-color: var(--ink); }
  #join-form button {
    width: 100%;
    padding: 7px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: inherit;
    font-size: .75rem;
    letter-spacing: .08em;
    cursor: pointer;
    border-radius: 3px;
    transition: opacity .15s;
  }
  #join-form button:hover { opacity: .8; }

  /* Online users */
  #user-list { list-style: none; }
  #user-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    font-size: .78rem;
  }
  #user-list li::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
  #user-list li.me { font-weight: 500; }
  #user-list li.me::after { content: ' (you)'; opacity: .4; }

  /* Activity log */
  #activity {
    flex: 1;
    overflow-y: auto;
    padding: 12px 18px;
  }
  .activity-item {
    font-size: .70rem;
    line-height: 1.5;
    padding: 4px 0;
    border-bottom: 1px solid var(--cream);
    opacity: .75;
  }
  .activity-item .time { opacity: .45; margin-right: 5px; }
  .activity-item.join  .who { color: var(--green); }
  .activity-item.leave .who { color: var(--accent); }
  .activity-item.edit  .who { color: var(--blue); }

  /* ── Editor area ── */
  .editor-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-toolbar {
    height: 38px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 6px;
    flex-shrink: 0;
  }
  .typing-indicator {
    font-size: .70rem;
    color: var(--blue);
    font-style: italic;
    margin-left: auto;
    min-height: 1em;
    transition: opacity .2s;
  }

  /* The textarea — the actual "doc" */
  #editor {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    padding: 48px 80px;
    font-family: 'Instrument Serif', serif;
    font-size: 1.08rem;
    line-height: 1.8;
    background: white;
    color: var(--ink);
    box-shadow: 0 0 40px var(--shadow) inset;
    overflow-y: auto;
  }
  #editor:disabled {
    background: #fafafa;
    cursor: not-allowed;
    opacity: .6;
  }

  /* ── Toast notifications ── */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 999;
    pointer-events: none;
  }
  .toast {
    padding: 10px 16px;
    border-radius: 4px;
    font-size: .75rem;
    background: var(--ink);
    color: var(--paper);
    opacity: 0;
    transform: translateY(8px);
    animation: toastIn .25s forwards, toastOut .3s 2.5s forwards;
    max-width: 260px;
  }
  .toast.join  { border-left: 3px solid var(--green); }
  .toast.leave { border-left: 3px solid var(--accent); }
  .toast.edit  { border-left: 3px solid var(--blue); }
  @keyframes toastIn  { to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }

  /* ── Overlay when not connected ── */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(247,244,239,.85);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Instrument Serif', serif;
    font-size: 1.1rem;
    color: var(--ink);
    opacity: .6;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 10;
  }
  #overlay.hidden { opacity: 0; }

  @media (max-width: 600px) {
    aside { display: none; }
    #editor { padding: 28px 22px; }
  }
</style>
</head>
<body>

<header>
  <h1>Collab<span>Doc</span></h1>
  <div id="status-dot"></div>
  <span id="status-text">not connected</span>
</header>

<main>
  <aside>
    <div class="sidebar-section" id="join-section">
      <div class="sidebar-label">Join</div>
      <div id="join-form">
        <input id="username-input" placeholder="Your name…" maxlength="20" autocomplete="off"/>
        <button id="join-btn">Connect →</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Online</div>
      <ul id="user-list"><li style="opacity:.35;font-size:.75rem">—</li></ul>
    </div>

    <div class="sidebar-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column;border-bottom:none">
      <div class="sidebar-label">Activity</div>
      <div id="activity"></div>
    </div>
  </aside>

  <div class="editor-wrap" style="position:relative">
    <div id="overlay">Enter your name to start editing</div>

    <div class="editor-toolbar">
      <span style="font-size:.7rem;opacity:.4;letter-spacing:.08em">DOCUMENT</span>
      <div class="typing-indicator" id="typing-indicator"></div>
    </div>

    <textarea id="editor" disabled placeholder="Document will appear here…"></textarea>
  </div>
</main>

<div id="toast-container"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let ws = null;
let myName = '';
let typingTimer = null;

const editor      = document.getElementById('editor');
const userList    = document.getElementById('user-list');
const activity    = document.getElementById('activity');
const statusDot   = document.getElementById('status-dot');
const statusText  = document.getElementById('status-text');
const typingEl    = document.getElementById('typing-indicator');
const overlay     = document.getElementById('overlay');
const joinSection = document.getElementById('join-section');

// ── Connect ───────────────────────────────────────────────────────────────────
document.getElementById('join-btn').addEventListener('click', connect);
document.getElementById('username-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') connect();
});

function connect() {
  const input = document.getElementById('username-input');
  const name  = input.value.trim();
  if (!name) { input.focus(); return; }
  if (ws) ws.close();

  myName = name;
  const url = `ws://${location.host}/ws/${encodeURIComponent(name)}`;
  ws = new WebSocket(url);

  setStatus('connecting…', '');

  ws.onopen = () => {
    setStatus('connected', 'online');
    editor.disabled = false;
    overlay.classList.add('hidden');
    joinSection.style.opacity = '.5';
    joinSection.style.pointerEvents = 'none';
    logActivity(`You joined as <span class="who">${name}</span>`, 'join');
  };

  ws.onclose = () => {
    setStatus('disconnected', 'offline');
    editor.disabled = true;
    overlay.classList.remove('hidden');
    overlay.textContent = 'Disconnected — refresh to reconnect';
    joinSection.style.opacity = '1';
    joinSection.style.pointerEvents = '';
  };

  ws.onerror = () => setStatus('connection error', 'offline');

  ws.onmessage = ({ data }) => {
    const msg = JSON.parse(data);
    handleMessage(msg);
  };
}

// ── Handle incoming messages ──────────────────────────────────────────────────
function handleMessage(msg) {
  switch (msg.type) {

    case 'init':
      editor.value = msg.content;
      break;

    case 'edit': {
      // Preserve cursor position while updating content
      const sel = editor.selectionStart;
      editor.value = msg.content;
      editor.setSelectionRange(sel, sel);

      // Show "X is typing" briefly
      typingEl.textContent = `${msg.author} is editing…`;
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => typingEl.textContent = '', 2000);

      logActivity(`<span class="who">${msg.author}</span> made an edit`, 'edit');
      toast(`✏️ ${msg.author} edited`, 'edit');
      break;
    }

    case 'user_list':
      renderUsers(msg.users);
      break;

    case 'notification':
      logActivity(`<span class="who">${msg.text}</span>`, msg.kind || 'join');
      toast(msg.kind === 'leave' ? `👋 ${msg.text}` : `👋 ${msg.text}`, msg.kind);
      break;

    case 'error':
      toast(`❌ ${msg.text}`, 'leave');
      setStatus(msg.text, 'offline');
      break;
  }
}

// ── Send edits ────────────────────────────────────────────────────────────────
editor.addEventListener('input', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'edit', content: editor.value }));
});

// ── UI helpers ────────────────────────────────────────────────────────────────
function setStatus(text, cls) {
  statusText.textContent = text;
  statusDot.className    = cls;
}

function renderUsers(users) {
  userList.innerHTML = users.map(u =>
    `<li class="${u === myName ? 'me' : ''}">${u}</li>`
  ).join('') || '<li style="opacity:.35;font-size:.75rem">—</li>';
}

function logActivity(html, kind = '') {
  const now  = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const item = document.createElement('div');
  item.className = `activity-item ${kind}`;
  item.innerHTML = `<span class="time">${now}</span>${html}`;
  activity.prepend(item);
  // Keep log from growing forever
  while (activity.children.length > 50) activity.lastChild.remove();
}

function toast(text, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = text;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
</script>
</body>
</html>
